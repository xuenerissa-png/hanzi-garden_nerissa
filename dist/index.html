</style><header><b>🌱 小朋友的汉字小花园</b><button id="sound">🔊 声音开</button></header><main><div class="tag">一点一点，种出自己的汉字</div><h1>小朋友，今天想写什么？</h1><p>跟着小提示敲一敲，让汉字在花园里开花。</p><div class="tabs"><button id="typeTab" class="active">⌨️ 我要打出字</button><button id="findTab">👂 我要找汉字</button><button id="libTab">📖 我的字库</button></div><div class="controls"><label>今天练习 <select id="group"><option value="names">我的名字 · 小花朵 / 宝宝</option><option value="0">挂图一 · 1—100</option><option value="1">挂图二 · 101—200</option><option value="2">挂图三 · 201—300</option><option value="all">全部字库</option></select></label><button id="read">🔊 再听一遍</button></div><div class="workspace"><div class="play-column"><section class="card"><div id="play"><div id="instruction" class="prompt"></div><div id="character" class="char"></div><div id="letters" class="letters"></div><div id="choices" class="choices"></div><div id="feedback" class="prompt" aria-live="polite"></div><button id="nextBtn" class="primary hidden">种下这个字 · 空格 🌼</button></div><div id="library" class="hidden"></div></section><div id="keyboard" class="keyboard"></div></div><section class="garden" id="garden"><div class="garden-heading"><b>小朋友的秘密花园</b><div id="flowerCount" class="garden-count">0 朵花</div></div><p class="garden-subtitle">每个亲手打出的字，都会开成一朵花</p><div class="landscape" aria-hidden="true"><div class="sun"></div><div class="cloud"></div><div class="butterfly">🦋</div><div class="hill"></div><div class="hill two"></div></div><div class="garden-bed"><div id="collected" class="flower-grid"></div><p id="empty">小种子在等你呢。<br>打出第一个字，让它开花吧！</p><div id="seedRow" class="seed-row" aria-hidden="true"><div class="sprout">🌱</div><div class="sprout">🌱</div><div class="sprout">🌱</div></div></div><div class="garden-bottom"><div id="roundDots" class="round-dots" aria-hidden="true"></div><div id="round"></div><button id="again" class="hidden">再种五朵花 🌷</button></div></section></div><div id="bloomToast" class="bloom-toast hidden" aria-hidden="true"></div><details class="voice-settings"><summary>♫ 配音设置</summary><div class="voice-options"><span>中文朗读</span><label>语速 <select id="voiceRate"><option value="1">自然</option><option value="0.9">慢一点</option></select></label><button id="voiceTest">试听</button><p class="voice-note">默认使用设备中文声音；可自行生成音频，或使用已获授权的配音。</p></div></details><p id="audioStatus" role="status"></p><audio id="narration" preload="none"></audio><p class="footer">Made by <a href="https://github.com/xuenerissa-png/hanzi-garden_nerissa" target="_blank" rel="noopener noreferrer">_nerissa</a><br>支持实体键盘和屏幕键盘 · 不计时，慢慢来<br>跟敲拼音是游戏提示；读音按挂图中的词语区分。支持设备朗读和自备配音。</p></main><script src="data.js"></script><script src="audio-map.js"></script><script>
